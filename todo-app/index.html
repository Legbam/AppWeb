<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Todo App</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="todo-container">
            <h1>My Todo List</h1>
            <div class="input-selection">
                <input type="text" id="taskInput" placeholder="Ajouter une nouvelle tâche...">
                <button id="addTaskBtn">Ajouter</button>
            </div>

            <!-- Liste des tâches -->
            <ul id="taskList">
                <!-- Les tâches seront ajoutées ici -->
            </ul>

            <!-- Filtres pour afficher toutes / actives / terminées -->
             <div class="filters">
                <button class="filter-btn active" data-filter="all">Toutes</button>
                <button class="filter-btn" data-filter="active">Actives</button>
                <button class="filter-btn" data-filter="done">Terminées</button>
            </div>

            <!-- Compteur de tâche restantes -->
            <p id="taskCounter"></p>

            <button id="clearDoneBtn" class="clear-done">Effacer les terminées</button>

            <!-- Bouton pour le thème sombre -->
            <button id="toggleTheme">🌙 Mode sombre</button>
        </div>

        <!-- Script pour effectuer la tache du bouton -->
         <script src="script.js"></script>

    </body>
</html>
